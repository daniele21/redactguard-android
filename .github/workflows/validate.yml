name: Validate

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Generate pinned Gradle wrapper bootstrap artifact
        run: gradle --no-daemon wrapper --gradle-version 9.5.0 --distribution-type bin

      - name: Validate Android project
        run: >-
          gradle --no-daemon
          spotlessCheck
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug

      - name: Upload Gradle wrapper bootstrap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.5.0-${{ github.run_id }}
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: error
          retention-days: 7
