name: Harnex independent-signer E2E

on:
  pull_request:
    branches: [dev]
    paths:
      - "app/**"
      - ".github/workflows/independent-signer-e2e.yml"
  workflow_dispatch:
    inputs:
      redactguard_ref:
        description: RedactGuard branch, tag, or commit to validate
        required: false
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: independent-signer-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.redactguard_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-harness-host:
    name: Build exact Harnex candidate
    uses: daniele21/android-local-llm-harness/.github/workflows/build-emulator-e2e-host.yml@7e876c0e5293ab8c0b0e3160e3e9878f7e1be30c
    with:
      harness_ref: 7e876c0e5293ab8c0b0e3160e3e9878f7e1be30c

  independent-signer-e2e:
    name: Different signers + explicit authorization
    needs: build-harness-host
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REDACTGUARD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.redactguard_ref }}
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Checkout RedactGuard exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REDACTGUARD_REF }}
          fetch-depth: 1
          path: redactguard

      - name: Download exact Harnex candidate
        uses: actions/download-artifact@v7
        with:
          name: shared-runtime-emulator-host
          path: ${{ runner.temp }}/harnex-candidate

      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          candidate="$RUNNER_TEMP/harnex-candidate"
          mkdir -p "$evidence"
          git -C redactguard rev-parse HEAD | tee "$evidence/redactguard-source-revision.txt"
          cp "$candidate/source-revision.txt" "$evidence/harnex-source-revision.txt"
          cp "$candidate/consumer-sdk-source-revision.txt" "$evidence/harnex-consumer-sdk-source-revision.txt"
          cp "$candidate/consumer-sdk-version.txt" "$evidence/harnex-consumer-sdk-version.txt"
          cmp -s "$evidence/harnex-source-revision.txt" "$evidence/harnex-consumer-sdk-source-revision.txt"
          test "$(tr -d '\r\n' < "$evidence/harnex-source-revision.txt")" = "7e876c0e5293ab8c0b0e3160e3e9878f7e1be30c"
          test -f "$candidate/harness-emulator-e2e.apk"
          test -f "$candidate/harness-debug-androidTest.apk"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd" "$RUNNER_TEMP/android-user"

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build RedactGuard against exact candidate SDK
        working-directory: redactguard
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          candidate_repo="$RUNNER_TEMP/harnex-candidate/consumer-sdk-repository"
          candidate_version="$(tr -d '\r\n' < "$RUNNER_TEMP/harnex-candidate/consumer-sdk-version.txt")"
          ./gradlew --no-configuration-cache \
            -PharnessConsumerSdkRepository="$candidate_repo" \
            -PharnessConsumerSdkVersion="$candidate_version" \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Sign Harnex and RedactGuard with distinct ephemeral identities
        id: signed
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/harnex-candidate"
          unsigned_host="$candidate/harness-emulator-e2e.apk"
          unsigned_host_test="$candidate/harness-debug-androidTest.apk"
          unsigned_app="redactguard/app/build/outputs/apk/debug/app-debug.apk"
          unsigned_app_test="redactguard/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          for apk in "$unsigned_host" "$unsigned_host_test" "$unsigned_app" "$unsigned_app_test"; do
            test -f "$apk"
          done

          signing_dir="$RUNNER_TEMP/independent-signer-keys"
          signed_dir="$RUNNER_TEMP/independent-signer-apks"
          mkdir -p "$signing_dir" "$signed_dir"
          host_keystore="$signing_dir/harnex.p12"
          consumer_keystore="$signing_dir/redactguard.p12"
          host_pass="harnex-independent-e2e"
          consumer_pass="redactguard-independent-e2e"

          keytool -genkeypair \
            -keystore "$host_keystore" -storetype PKCS12 \
            -storepass "$host_pass" -keypass "$host_pass" \
            -alias harnex-e2e -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Harnex Independent Signer E2E,O=Local Test,C=IT" -noprompt
          keytool -genkeypair \
            -keystore "$consumer_keystore" -storetype PKCS12 \
            -storepass "$consumer_pass" -keypass "$consumer_pass" \
            -alias redactguard-e2e -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=RedactGuard Independent Signer E2E,O=Local Test,C=IT" -noprompt

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          sign_apk() {
            local source="$1"
            local target="$2"
            local keystore="$3"
            local alias="$4"
            local password="$5"
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$alias" \
              --ks-pass "pass:$password" \
              --key-pass "pass:$password" \
              --out "$target" \
              "$source"
            "$apksigner" verify "$target"
          }

          host_apk="$signed_dir/harnex-emulator-e2e.apk"
          host_test_apk="$signed_dir/harnex-debug-androidTest.apk"
          app_apk="$signed_dir/redactguard-debug.apk"
          app_test_apk="$signed_dir/redactguard-debug-androidTest.apk"
          sign_apk "$unsigned_host" "$host_apk" "$host_keystore" harnex-e2e "$host_pass"
          sign_apk "$unsigned_host_test" "$host_test_apk" "$host_keystore" harnex-e2e "$host_pass"
          sign_apk "$unsigned_app" "$app_apk" "$consumer_keystore" redactguard-e2e "$consumer_pass"
          sign_apk "$unsigned_app_test" "$app_test_apk" "$consumer_keystore" redactguard-e2e "$consumer_pass"

          rm -rf "$signing_dir"
          echo "host_apk=$host_apk" >> "$GITHUB_OUTPUT"
          echo "host_test_apk=$host_test_apk" >> "$GITHUB_OUTPUT"
          echo "app_apk=$app_apk" >> "$GITHUB_OUTPUT"
          echo "app_test_apk=$app_test_apk" >> "$GITHUB_OUTPUT"

      - name: Prove signer separation
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          digest() {
            "$apksigner" verify --print-certs "$1" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          }
          host_signer="$(digest '${{ steps.signed.outputs.host_apk }}')"
          host_test_signer="$(digest '${{ steps.signed.outputs.host_test_apk }}')"
          consumer_signer="$(digest '${{ steps.signed.outputs.app_apk }}')"
          consumer_test_signer="$(digest '${{ steps.signed.outputs.app_test_apk }}')"
          test -n "$host_signer"
          test -n "$consumer_signer"
          test "$host_signer" = "$host_test_signer"
          test "$consumer_signer" = "$consumer_test_signer"
          test "$host_signer" != "$consumer_signer"
          {
            echo "harnex_signer_sha256=$host_signer"
            echo "redactguard_signer_sha256=$consumer_signer"
            echo "signers_are_distinct=true"
          } | tee "$evidence/signer-identities.txt"
          echo "consumer_signer=$consumer_signer" >> "$GITHUB_OUTPUT"

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Create and start emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd \
            --force \
            --name harnex-independent-signer-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd harnex-independent-signer-api35 \
            -port 5554 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot \
            > "$RUNNER_TEMP/independent-signer-e2e/emulator.log" 2>&1 &
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
              adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
              adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/independent-signer-e2e/emulator.log" >&2 || true
          exit 1

      - name: Install independently signed Host and Consumer
        shell: bash
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.host_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.host_test_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.app_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.app_test_apk }}"

      - name: Prove independent signer starts fail-closed
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#independentSignerIsDeniedUntilExplicitlyAuthorized \
            io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$evidence/redactguard-pending-authorization.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-pending-authorization.txt"

      - name: Authorize exact observed identity from Harnex-owned instrumentation
        shell: bash
        env:
          CONSUMER_SIGNER: ${{ steps.identity.outputs.consumer_signer }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e consumerPackage io.github.daniele21.redactguard.debug \
            -e consumerSignerSha256 "$CONSUMER_SIGNER" \
            -e class io.github.daniele21.localllm.phonetest.HarnessIndependentConsumerAuthorizationInstrumentationTest#authorizeExactObservedConsumerIdentity \
            io.github.daniele21.localllm.phonetest.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$evidence/harnex-explicit-authorization.txt"
          grep -q "OK (1 test)" "$evidence/harnex-explicit-authorization.txt"

      - name: Prove authorized signer can disconnect and reconnect
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#authorizedIndependentSignerCanDisconnectAndReconnect \
            io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$evidence/redactguard-authorized-reconnect.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-authorized-reconnect.txt"

      - name: Capture bounded package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell dumpsys package io.github.daniele21.redactguard.debug \
            | tr -d '\r' \
            | grep -E 'io\.github\.daniele21\.localllm\.debug\.permission\.BIND_LOCAL_LLM|granted=' \
            > "$evidence/redactguard-bind-permission.txt" || true
          sha256sum \
            "${{ steps.signed.outputs.host_apk }}" \
            "${{ steps.signed.outputs.host_test_apk }}" \
            "${{ steps.signed.outputs.app_apk }}" \
            "${{ steps.signed.outputs.app_test_apk }}" \
            > "$evidence/apk-sha256.txt"

      - name: Upload privacy-safe E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harnex-independent-signer-e2e
          path: ${{ runner.temp }}/independent-signer-e2e/**
          if-no-files-found: error
          retention-days: 14