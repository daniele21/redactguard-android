name: LAS-14 restack once

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  restack:
    if: github.head_ref == 'refactor/las-14-product-viewmodel-setup-boundary-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fresh LAS-14 branch
        uses: actions/checkout@v7
        with:
          ref: refactor/las-14-product-viewmodel-setup-boundary-v2
          fetch-depth: 0

      - name: Apply isolated LAS-14 commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 28574d5613bee2c7bd35a6b66600feabc001d274
          git cherry-pick cc6188a78b9f4f0c601feeb47e3f9756018a9e36
          git cherry-pick 037a2b9257312c9d0e17df1ce69d57bb56e6be52
          git push origin HEAD:refactor/las-14-product-viewmodel-setup-boundary-v2
