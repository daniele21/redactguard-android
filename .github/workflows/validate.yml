name: Validate

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate pinned wrapper
        run: ./gradlew --version

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Compile app Kotlin
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:compileDebugKotlin 2>&1 | tee /tmp/compile-kotlin.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            grep -E '(^e: |error:|Unresolved reference|Type mismatch|Argument type mismatch|Cannot infer|No value passed)' \
              /tmp/compile-kotlin.log \
              | tail -n 40 \
              | while IFS= read -r line; do
                  escaped="${line//'%'/'%25'}"
                  escaped="${escaped//$'\r'/'%0D'}"
                  echo "::error title=Kotlin compile::$escaped"
                done
            exit "$status"
          fi

      - name: Compile JVM unit tests
        run: ./gradlew --no-daemon :app:compileDebugUnitTestKotlin

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Assemble minified release APK
        env:
          REDACTGUARD_ALLOW_UNSIGNED_RELEASE: 'true'
        run: ./gradlew --no-daemon :app:assembleRelease
