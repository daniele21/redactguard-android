name: Two-APK explicit cancel diagnostic

on:
  push:
    branches:
      - feature/local-ai-setup-readiness

permissions:
  contents: read

jobs:
  build-harness-host:
    name: Build instrumented Harness host
    uses: daniele21/android-local-llm-harness/.github/workflows/build-emulator-e2e-host.yml@9561034af0a43f11edd2ec477becc6686cbeebb5
    with:
      harness_ref: 9561034af0a43f11edd2ec477becc6686cbeebb5

  explicit-cancel:
    name: Explicit cancel on API 35
    needs: build-harness-host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Checkout exact RedactGuard candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: redactguard

      - name: Download instrumented Harness host
        uses: actions/download-artifact@v7
        with:
          name: shared-runtime-emulator-host
          path: ${{ runner.temp }}/harness-emulator-host

      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cancel-diagnostic"
          git -C redactguard rev-parse HEAD > "$RUNNER_TEMP/cancel-diagnostic/redactguard-source-revision.txt"
          cp "$RUNNER_TEMP/harness-emulator-host/source-revision.txt" \
            "$RUNNER_TEMP/cancel-diagnostic/harness-source-revision.txt"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd" "$RUNNER_TEMP/android-user"

      - name: Install emulator image
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build RedactGuard app and instrumentation
        working-directory: redactguard
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Sign Host Consumer and instrumentation with one key
        id: signed
        shell: bash
        run: |
          set -euo pipefail
          unsigned_host="$RUNNER_TEMP/harness-emulator-host/harness-emulator-e2e.apk"
          unsigned_app="redactguard/app/build/outputs/apk/debug/app-debug.apk"
          unsigned_test="redactguard/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          signing_dir="$RUNNER_TEMP/cancel-signing"
          signed_dir="$RUNNER_TEMP/cancel-signed"
          mkdir -p "$signing_dir" "$signed_dir"
          keystore="$signing_dir/e2e-signing.p12"
          store_pass="shared-runtime-emulator-e2e"
          keytool -genkeypair \
            -keystore "$keystore" \
            -storetype PKCS12 \
            -storepass "$store_pass" \
            -keypass "$store_pass" \
            -alias shared-runtime-emulator-e2e \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Shared Runtime Emulator E2E,O=Local Test,C=IT" \
            -noprompt
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          sign_apk() {
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias shared-runtime-emulator-e2e \
              --ks-pass "pass:$store_pass" \
              --key-pass "pass:$store_pass" \
              --out "$2" \
              "$1"
            "$apksigner" verify "$2"
          }
          host_apk="$signed_dir/harness-emulator-e2e.apk"
          app_apk="$signed_dir/redactguard-debug.apk"
          test_apk="$signed_dir/redactguard-debug-androidTest.apk"
          sign_apk "$unsigned_host" "$host_apk"
          sign_apk "$unsigned_app" "$app_apk"
          sign_apk "$unsigned_test" "$test_apk"
          echo "host_apk=$host_apk" >> "$GITHUB_OUTPUT"
          echo "app_apk=$app_apk" >> "$GITHUB_OUTPUT"
          echo "test_apk=$test_apk" >> "$GITHUB_OUTPUT"

      - name: Start API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd \
            --force \
            --name shared-runtime-cancel-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd shared-runtime-cancel-api35 \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            > "$RUNNER_TEMP/cancel-diagnostic/emulator.log" 2>&1 &
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install exact APK set
        shell: bash
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.host_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.app_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.test_apk }}"
          adb -s "$ANDROID_SERIAL" logcat -c

      - name: Run explicit cancellation only
        shell: bash
        run: |
          set -o pipefail
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.TwoApkExplicitCancelE2eTest#explicitCancelPublishesExactTerminalAndCleansHostWaiter \
            io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/cancel-diagnostic/explicit-cancel-instrumentation.txt"

      - name: Capture cancellation trace
        if: always()
        shell: bash
        run: |
          adb -s "$ANDROID_SERIAL" logcat -d > "$RUNNER_TEMP/cancel-diagnostic/logcat.txt" || true
          grep -F 'HARNEX_CANCEL_TRACE' "$RUNNER_TEMP/cancel-diagnostic/logcat.txt" \
            > "$RUNNER_TEMP/cancel-diagnostic/cancel-trace.txt" || true
          target_package="io.github.daniele21.redactguard.debug"
          device_dir="/sdcard/Android/data/$target_package/files/two-apk-explicit-cancel"
          mkdir -p "$RUNNER_TEMP/cancel-diagnostic/two-apk-explicit-cancel"
          adb -s "$ANDROID_SERIAL" pull "$device_dir/." \
            "$RUNNER_TEMP/cancel-diagnostic/two-apk-explicit-cancel/" || true

      - name: Stop emulator
        if: always()
        shell: bash
        run: adb -s "$ANDROID_SERIAL" emu kill || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: two-apk-explicit-cancel-diagnostic
          path: ${{ runner.temp }}/cancel-diagnostic/**
          if-no-files-found: error
          retention-days: 7
