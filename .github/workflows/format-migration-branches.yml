name: Format migration branches

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev

permissions:
  contents: write

jobs:
  spotless-apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      startsWith(github.head_ref, 'agent/rg')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatting only when needed
        run: |
          git add -- '*.kt' '*.kts'
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply repository formatting"
          git push origin HEAD:${{ github.head_ref }}
