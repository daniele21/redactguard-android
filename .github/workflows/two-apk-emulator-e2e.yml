name: Two-APK emulator E2E

on:
  pull_request:
    branches: [dev]
    paths:
      - "app/**"
      - ".engineering/e2e.json"
      - ".github/workflows/two-apk-emulator-e2e.yml"
  workflow_dispatch:
    inputs:
      harness_ref:
        description: Exact Harnex commit to validate
        required: true
        type: string
      redactguard_ref:
        description: RedactGuard branch, tag, or commit to validate
        required: false
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: two-apk-emulator-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.redactguard_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-harness-host:
    name: Build Harnex-owned emulator candidate
    uses: daniele21/android-local-llm-harness/.github/workflows/build-emulator-e2e-host.yml@a4d77d5a0ada5cb55e48c5a8e4e4234c84b85162
    with:
      harness_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.harness_ref || 'a4d77d5a0ada5cb55e48c5a8e4e4234c84b85162' }}

  two-apk-emulator-e2e:
    name: Harnex + RedactGuard on API 35
    needs: build-harness-host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REDACTGUARD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.redactguard_ref }}
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Checkout RedactGuard exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REDACTGUARD_REF }}
          fetch-depth: 1
          path: redactguard

      - name: Download Harnex-owned emulator candidate
        uses: actions/download-artifact@v7
        with:
          name: shared-runtime-emulator-host
          path: ${{ runner.temp }}/harness-emulator-host

      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/two-apk-emulator"
          harness_artifact="$RUNNER_TEMP/harness-emulator-host"
          mkdir -p "$evidence"
          git -C redactguard rev-parse HEAD | tee "$evidence/redactguard-source-revision.txt"
          cp "$harness_artifact/source-revision.txt" "$evidence/harness-source-revision.txt"
          cp "$harness_artifact/consumer-sdk-source-revision.txt" "$evidence/harness-consumer-sdk-source-revision.txt"
          cp "$harness_artifact/consumer-sdk-version.txt" "$evidence/harness-consumer-sdk-version.txt"
          cmp -s "$evidence/harness-source-revision.txt" "$evidence/harness-consumer-sdk-source-revision.txt"
          test -d "$harness_artifact/consumer-sdk-repository/io/github/daniele21/localllm"
          test -s "$harness_artifact/consumer-sdk-repository/build-manifest.txt"
          test -f "$harness_artifact/harness-emulator-e2e.apk"
          test -f "$harness_artifact/harness-debug-androidTest.apk"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd" "$RUNNER_TEMP/android-user"

      - name: Install emulator image
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build exact RedactGuard app and instrumentation
        working-directory: redactguard
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          candidate_repo="$RUNNER_TEMP/harness-emulator-host/consumer-sdk-repository"
          candidate_version="$(tr -d '\r\n' < "$RUNNER_TEMP/harness-emulator-host/consumer-sdk-version.txt")"
          test -n "$candidate_version"
          test -d "$candidate_repo/io/github/daniele21/localllm"
          ./gradlew --no-configuration-cache \
            -PharnessConsumerSdkRepository="$candidate_repo" \
            -PharnessConsumerSdkVersion="$candidate_version" \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest
          ./gradlew --no-configuration-cache \
            -PharnessConsumerSdkRepository="$candidate_repo" \
            -PharnessConsumerSdkVersion="$candidate_version" \
            :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency io.github.daniele21.localllm:consumer-android \
            | tee "$RUNNER_TEMP/two-apk-emulator/consumer-sdk-dependency-insight.txt"
          grep -F "io.github.daniele21.localllm:consumer-android:$candidate_version" \
            "$RUNNER_TEMP/two-apk-emulator/consumer-sdk-dependency-insight.txt"

      - name: Sign Host and Consumer with distinct ephemeral identities
        id: signed
        shell: bash
        run: |
          set -euo pipefail
          unsigned_host="$RUNNER_TEMP/harness-emulator-host/harness-emulator-e2e.apk"
          unsigned_host_test="$RUNNER_TEMP/harness-emulator-host/harness-debug-androidTest.apk"
          unsigned_app="redactguard/app/build/outputs/apk/debug/app-debug.apk"
          unsigned_test="redactguard/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          for apk in "$unsigned_host" "$unsigned_host_test" "$unsigned_app" "$unsigned_test"; do
            test -f "$apk"
          done

          signing_dir="$RUNNER_TEMP/shared-runtime-emulator-signing"
          signed_dir="$RUNNER_TEMP/shared-runtime-emulator-signed"
          mkdir -p "$signing_dir" "$signed_dir"
          host_keystore="$signing_dir/host.p12"
          consumer_keystore="$signing_dir/consumer.p12"
          host_pass="shared-runtime-host-e2e"
          consumer_pass="shared-runtime-consumer-e2e"

          keytool -genkeypair \
            -keystore "$host_keystore" -storetype PKCS12 \
            -storepass "$host_pass" -keypass "$host_pass" \
            -alias harnex-e2e -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Harnex Two APK E2E,O=Local Test,C=IT" -noprompt
          keytool -genkeypair \
            -keystore "$consumer_keystore" -storetype PKCS12 \
            -storepass "$consumer_pass" -keypass "$consumer_pass" \
            -alias redactguard-e2e -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=RedactGuard Two APK E2E,O=Local Test,C=IT" -noprompt

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          sign_apk() {
            local source="$1"
            local target="$2"
            local keystore="$3"
            local alias="$4"
            local password="$5"
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$alias" \
              --ks-pass "pass:$password" \
              --key-pass "pass:$password" \
              --out "$target" \
              "$source"
            "$apksigner" verify "$target"
          }

          host_apk="$signed_dir/harness-emulator-e2e.apk"
          host_test_apk="$signed_dir/harness-debug-androidTest.apk"
          app_apk="$signed_dir/redactguard-debug.apk"
          test_apk="$signed_dir/redactguard-debug-androidTest.apk"
          sign_apk "$unsigned_host" "$host_apk" "$host_keystore" harnex-e2e "$host_pass"
          sign_apk "$unsigned_host_test" "$host_test_apk" "$host_keystore" harnex-e2e "$host_pass"
          sign_apk "$unsigned_app" "$app_apk" "$consumer_keystore" redactguard-e2e "$consumer_pass"
          sign_apk "$unsigned_test" "$test_apk" "$consumer_keystore" redactguard-e2e "$consumer_pass"

          rm -rf "$signing_dir"
          echo "host_apk=$host_apk" >> "$GITHUB_OUTPUT"
          echo "host_test_apk=$host_test_apk" >> "$GITHUB_OUTPUT"
          echo "app_apk=$app_apk" >> "$GITHUB_OUTPUT"
          echo "test_apk=$test_apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK identities are production-shaped
        id: apks
        shell: bash
        run: |
          set -euo pipefail
          host_apk="${{ steps.signed.outputs.host_apk }}"
          host_test_apk="${{ steps.signed.outputs.host_test_apk }}"
          app_apk="${{ steps.signed.outputs.app_apk }}"
          test_apk="${{ steps.signed.outputs.test_apk }}"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          digest() {
            "$apksigner" verify --print-certs "$1" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          }
          host_signer="$(digest "$host_apk")"
          host_test_signer="$(digest "$host_test_apk")"
          app_signer="$(digest "$app_apk")"
          test_signer="$(digest "$test_apk")"
          test -n "$host_signer"
          test -n "$app_signer"
          test "$host_signer" = "$host_test_signer"
          test "$app_signer" = "$test_signer"
          test "$host_signer" != "$app_signer"

          sha256sum "$host_apk" "$host_test_apk" "$app_apk" "$test_apk" \
            | tee "$RUNNER_TEMP/two-apk-emulator/apk-sha256.txt"
          {
            echo "harnex_signer_sha256=$host_signer"
            echo "redactguard_signer_sha256=$app_signer"
            echo "signers_are_distinct=true"
          } | tee "$RUNNER_TEMP/two-apk-emulator/signer-identities.txt"
          echo "host_apk=$host_apk" >> "$GITHUB_OUTPUT"
          echo "host_test_apk=$host_test_apk" >> "$GITHUB_OUTPUT"
          echo "app_apk=$app_apk" >> "$GITHUB_OUTPUT"
          echo "test_apk=$test_apk" >> "$GITHUB_OUTPUT"
          echo "consumer_signer=$app_signer" >> "$GITHUB_OUTPUT"

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Create and start emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd \
            --force \
            --name shared-runtime-two-apk-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd shared-runtime-two-apk-api35 \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            > "$RUNNER_TEMP/two-apk-emulator/emulator.log" 2>&1 &

          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
              adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
              adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/two-apk-emulator/emulator.log" >&2 || true
          exit 1

      - name: Install Consumer first and prove Host-absent state
        shell: bash
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" install "${{ steps.apks.outputs.app_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.apks.outputs.test_apk }}"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.TwoApkEmulatorE2eTest#hostAbsentFailsClosedWithoutMakingAnalysisReady \
            io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/two-apk-emulator/host-absent-instrumentation.txt"
          grep -q "OK (1 test)" "$RUNNER_TEMP/two-apk-emulator/host-absent-instrumentation.txt"

      - name: Install independently signed Harnex without reinstalling Consumer
        shell: bash
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" install "${{ steps.apks.outputs.host_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.apks.outputs.host_test_apk }}"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#bindCapabilityIsGrantedWhenConsumerWasInstalledBeforeHost \
            io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/two-apk-emulator/install-order-service.txt"
          grep -q "OK (1 test)" "$RUNNER_TEMP/two-apk-emulator/install-order-service.txt"

      - name: Prove Consumer is pending before Harnex authorization
        shell: bash
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#independentSignerIsDeniedUntilExplicitlyAuthorized \
            io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/two-apk-emulator/pending-authorization.txt"
          grep -q "OK (1 test)" "$RUNNER_TEMP/two-apk-emulator/pending-authorization.txt"

      - name: Authorize exact observed Consumer identity
        shell: bash
        env:
          CONSUMER_SIGNER: ${{ steps.apks.outputs.consumer_signer }}
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e consumerPackage io.github.daniele21.redactguard.debug \
            -e consumerSignerSha256 "$CONSUMER_SIGNER" \
            -e class io.github.daniele21.localllm.phonetest.HarnessIndependentConsumerAuthorizationInstrumentationTest#authorizeExactObservedConsumerIdentity \
            io.github.daniele21.localllm.phonetest.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/two-apk-emulator/harnex-explicit-authorization.txt"
          grep -q "OK (1 test)" "$RUNNER_TEMP/two-apk-emulator/harnex-explicit-authorization.txt"

      - name: Run cross-process product journey
        shell: bash
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.TwoApkEmulatorE2eTest#realBinderControlPlaneRuntimeAndReviewSurviveHostRestart \
            io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/two-apk-emulator/two-apk-instrumentation.txt"
          grep -q "OK (1 test)" "$RUNNER_TEMP/two-apk-emulator/two-apk-instrumentation.txt"

      - name: Prove ViewModel detach and Android Home-switch continuity
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/two-apk-emulator"
          test_runner="io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner"

          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.TwoApkEmulatorE2eTest#analysisSurvivesViewModelStoreClearAndReattachesSameProcessJob \
            "$test_runner" \
            | tee "$evidence/viewmodel-reattach-instrumentation.txt"
          grep -q "OK (1 test)" "$evidence/viewmodel-reattach-instrumentation.txt"

          device_media_dir="/sdcard/Android/data/io.github.daniele21.redactguard.debug/files/two-apk-lifecycle"
          device_video="/sdcard/Download/redactguard-two-apk-background.mp4"
          adb -s "$ANDROID_SERIAL" shell rm -rf "$device_media_dir"
          adb -s "$ANDROID_SERIAL" shell rm -f "$device_video"

          adb -s "$ANDROID_SERIAL" shell screenrecord \
            --bit-rate 4000000 \
            --time-limit 90 \
            "$device_video" \
            > "$evidence/background-screenrecord.log" 2>&1 &
          recorder_pid=$!

          set +e
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.TwoApkEmulatorE2eTest#analysisSurvivesHomeSwitchAndReturnsToReviewWithSameProcessJob \
            "$test_runner" \
            | tee "$evidence/background-home-switch-instrumentation.txt"
          lifecycle_status=${PIPESTATUS[0]}
          set -e

          adb -s "$ANDROID_SERIAL" shell pkill -INT screenrecord >/dev/null 2>&1 || true
          wait "$recorder_pid" || true
          test "$lifecycle_status" -eq 0
          grep -q "OK (1 test)" "$evidence/background-home-switch-instrumentation.txt"

          mkdir -p "$evidence/lifecycle-screenshots" "$evidence/lifecycle-video"
          adb -s "$ANDROID_SERIAL" pull "$device_media_dir/." "$evidence/lifecycle-screenshots/"
          adb -s "$ANDROID_SERIAL" pull "$device_video" "$evidence/lifecycle-video/background-analysis.mp4"

          test -s "$evidence/lifecycle-screenshots/01-analysis-before-home.png"
          test -s "$evidence/lifecycle-screenshots/02-launcher-background.png"
          test -s "$evidence/lifecycle-screenshots/03-review-after-return.png"
          test -s "$evidence/lifecycle-screenshots/lifecycle-identity.txt"
          test -s "$evidence/lifecycle-video/background-analysis.mp4"

      - name: Prove Binder cancel process-loss and critical-pressure matrix
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/two-apk-emulator"
          test_runner="io.github.daniele21.redactguard.debug.test/androidx.test.runner.AndroidJUnitRunner"
          target_package="io.github.daniele21.redactguard.debug"

          run_test() {
            local slug="$1"
            local test_name="$2"
            adb -s "$ANDROID_SERIAL" shell am instrument -w \
              -e class "$test_name" \
              "$test_runner" \
              | tee "$evidence/${slug}-instrumentation.txt"
            grep -q "OK (1 test)" "$evidence/${slug}-instrumentation.txt"
          }

          run_test \
            binder-loss \
            io.github.daniele21.redactguard.TwoApkBinderLossE2eTest#acceptedLogicalJobSurvivesBinderDisconnectAndRebind
          run_test \
            explicit-cancel \
            io.github.daniele21.redactguard.TwoApkExplicitCancelE2eTest#explicitCancelPublishesExactTerminalAndCleansHostWaiter
          run_test \
            host-process-loss \
            io.github.daniele21.redactguard.TwoApkHostProcessLossE2eTest#activeLogicalJobBecomesStructuredHostProcessLossAfterHostRestart
          run_test \
            critical-pressure \
            io.github.daniele21.redactguard.TwoApkCriticalMemoryPressureE2eTest#activeLogicalJobFailsAsRuntimePressureAndCleansHostExecution
          run_test \
            redactguard-process-loss-phase1 \
            io.github.daniele21.redactguard.TwoApkRedactGuardProcessLossE2eTest#phase1StartsActiveAnalysisWithoutPersistingSensitiveReattachContext

          adb -s "$ANDROID_SERIAL" shell am force-stop "$target_package"

          run_test \
            redactguard-process-loss-phase2 \
            io.github.daniele21.redactguard.TwoApkRedactGuardProcessLossE2eTest#phase2StartsFreshWithoutReconstructingLostDocumentOrProductJob

          device_base="/sdcard/Android/data/$target_package/files"
          for dir in \
            two-apk-binder-loss \
            two-apk-explicit-cancel \
            two-apk-host-process-loss \
            two-apk-critical-pressure \
            two-apk-redactguard-process-loss; do
            mkdir -p "$evidence/$dir"
            adb -s "$ANDROID_SERIAL" pull "$device_base/$dir/." "$evidence/$dir/"
          done

          test -s "$evidence/two-apk-binder-loss/binder-loss-identity.txt"
          test -s "$evidence/two-apk-explicit-cancel/explicit-cancel-identity.txt"
          test -s "$evidence/two-apk-host-process-loss/host-process-loss-identity.txt"
          test -s "$evidence/two-apk-critical-pressure/critical-pressure-identity.txt"
          test -s "$evidence/two-apk-redactguard-process-loss/redactguard-process-loss-identity.txt"

      - name: Record bounded package state
        if: always()
        shell: bash
        run: |
          {
            adb -s "$ANDROID_SERIAL" shell dumpsys package io.github.daniele21.localllm.phonetest.debug \
              | grep -E 'versionCode=|versionName=|firstInstallTime=|lastUpdateTime=' || true
            adb -s "$ANDROID_SERIAL" shell dumpsys package io.github.daniele21.redactguard.debug \
              | grep -E 'versionCode=|versionName=|firstInstallTime=|lastUpdateTime=' || true
          } > "$RUNNER_TEMP/two-apk-emulator/package-state.txt"
          adb -s "$ANDROID_SERIAL" shell dumpsys package io.github.daniele21.localllm.phonetest.debug \
            | tr -d '\r' \
            | sed -n '/HarnessSharedRuntimeService/,+10p' \
            > "$RUNNER_TEMP/two-apk-emulator/harnex-service-state.txt" || true
          adb -s "$ANDROID_SERIAL" shell logcat -d -s RG_LOCAL_AI:I '*:S' \
            > "$RUNNER_TEMP/two-apk-emulator/local-ai-logcat.txt" || true

      - name: Stop emulator
        if: always()
        shell: bash
        run: adb -s "$ANDROID_SERIAL" emu kill || true

      - name: Upload two-APK emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-runtime-two-apk-emulator-evidence
          path: |
            ${{ runner.temp }}/two-apk-emulator/**
          if-no-files-found: error
          retention-days: 14
