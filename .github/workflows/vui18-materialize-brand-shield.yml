name: VUI18 Materialize Brand Shield

on:
  push:
    branches:
      - agent/rg-vui18-exact-head-integration
    paths:
      - .github/workflows/vui18-materialize-brand-shield.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: agent/rg-vui18-exact-head-integration
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify canonical target and materialize Android-safe shield
        shell: bash
        run: |
          set -euo pipefail
          source='design/reference/approved-target.png'
          output='app/src/main/res/drawable-nodpi/redactguard_android_shield.png'
          expected_source_sha='12bf09dd567c1f814e836e08b605e61180ad276ade38ba1b908e8ce502b8b2d4'

          actual_source_sha="$(sha256sum "$source" | awk '{print $1}')"
          [[ "$actual_source_sha" == "$expected_source_sha" ]] || {
            echo "Canonical target SHA mismatch: expected $expected_source_sha got $actual_source_sha" >&2
            exit 1
          }

          cat > /tmp/CropShield.java <<'JAVA'
          import java.awt.Graphics2D;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public final class CropShield {
              public static void main(String[] args) throws Exception {
                  BufferedImage source = ImageIO.read(new File(args[0]));
                  if (source == null) {
                      throw new IllegalStateException("Unable to decode canonical target PNG");
                  }
                  if (source.getWidth() != 1536 || source.getHeight() != 1024) {
                      throw new IllegalStateException(
                          "Unexpected canonical target dimensions: "
                              + source.getWidth() + "x" + source.getHeight()
                      );
                  }

                  BufferedImage crop = source.getSubimage(8, 18, 54, 67);
                  BufferedImage androidSafe = new BufferedImage(54, 67, BufferedImage.TYPE_INT_ARGB);
                  Graphics2D graphics = androidSafe.createGraphics();
                  try {
                      graphics.drawImage(crop, 0, 0, null);
                  } finally {
                      graphics.dispose();
                  }

                  File output = new File(args[1]);
                  if (!ImageIO.write(androidSafe, "png", output)) {
                      throw new IllegalStateException("No PNG writer available");
                  }

                  BufferedImage verification = ImageIO.read(output);
                  if (verification == null || verification.getWidth() != 54 || verification.getHeight() != 67) {
                      throw new IllegalStateException("Generated Android shield is not a valid 54x67 PNG");
                  }
              }
          }
          JAVA

          java /tmp/CropShield.java "$source" "$output"
          file "$output"
          sha256sum "$output"

      - name: Commit only the canonical derived asset and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/redactguard_android_shield.png
          git rm .github/workflows/vui18-materialize-brand-shield.yml
          git diff --cached --check
          git commit -m 'fix(ui): materialize Android-safe RedactGuard shield'
          git push origin HEAD:agent/rg-vui18-exact-head-integration
