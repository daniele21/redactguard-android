name: Validate

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate pinned wrapper
        run: ./gradlew --version

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Compile app Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Compile JVM unit tests
        run: ./gradlew --no-daemon :app:compileDebugUnitTestKotlin

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
