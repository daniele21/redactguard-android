name: Physical release APK candidate

on:
  push:
    branches: [ci/physical-candidate-4bbde70f]
    paths:
      - ".github/workflows/physical-release-apk-candidate.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build exact signed RedactGuard release APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@v7
        with:
          ref: 4bbde70f3268674c3a476bc2b3ab1a19c81ed695
          fetch-depth: 1
          path: candidate

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "4bbde70f3268674c3a476bc2b3ab1a19c81ed695"
          test -z "$(git -C candidate status --porcelain --untracked-files=normal)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore protected upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_B64"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/physical-upload.p12"
          chmod 600 "$RUNNER_TEMP/physical-upload.p12"

      - name: Build signed exact-candidate APK
        working-directory: candidate
        env:
          REDACTGUARD_ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/physical-upload.p12
          REDACTGUARD_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          REDACTGUARD_ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS || 'local-llm-phone-test-upload' }}
          REDACTGUARD_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD || secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          REDACTGUARD_BUILD_ID: physical-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash scripts/build-redactguard-release.sh build-apk

      - name: Record bounded identity and signer evidence
        shell: bash
        run: |
          set -euo pipefail
          apk="candidate/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          out="$RUNNER_TEMP/physical-candidate"
          mkdir -p "$out"
          cp "$apk" "$out/redactguard-release-4bbde70f.apk"
          sha256sum "$apk" | tee "$out/apk-sha256.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee "$out/apk-signer.txt"
          printf '%s\n' "sourceRevision=4bbde70f3268674c3a476bc2b3ab1a19c81ed695" > "$out/source-identity.txt"
          printf '%s\n' "checkoutRevision=$(git -C candidate rev-parse HEAD)" >> "$out/source-identity.txt"

      - name: Remove protected keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/physical-upload.p12"

      - name: Upload signed physical candidate
        uses: actions/upload-artifact@v7
        with:
          name: redactguard-physical-release-4bbde70f
          path: ${{ runner.temp }}/physical-candidate/**
          if-no-files-found: error
          retention-days: 7
