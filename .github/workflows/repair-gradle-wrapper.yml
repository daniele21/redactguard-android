name: Repair Gradle wrapper

on:
  push:
    branches:
      - agent/rg0-bootstrap
    paths:
      - '.github/workflows/repair-gradle-wrapper.yml'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/rg0-bootstrap

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Regenerate exact wrapper
        run: gradle --no-daemon wrapper --gradle-version 9.5.0 --distribution-type bin

      - name: Verify wrapper binary
        run: |
          test "$(wc -c < gradle/wrapper/gradle-wrapper.jar)" -eq 48462
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')" = "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"

      - name: Commit repaired wrapper
        run: |
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already matches the validated Gradle 9.5.0 artifact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: repair Gradle 9.5.0 wrapper binary"
          git push origin HEAD:agent/rg0-bootstrap
