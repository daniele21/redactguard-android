name: Harnex release-identity independent-signer E2E

on:
  pull_request:
    branches: [dev]
    paths:
      - "app/**"
      - ".github/workflows/independent-signer-e2e.yml"
  workflow_dispatch:
    inputs:
      redactguard_ref:
        description: RedactGuard branch, tag, or commit to validate
        required: false
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: independent-signer-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.redactguard_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-harness-host:
    name: Build exact Harnex release-identity candidate
    uses: daniele21/android-local-llm-harness/.github/workflows/build-emulator-e2e-host.yml@06321ada327666da259fb41fed2200e3087c0ff7
    with:
      harness_ref: 06321ada327666da259fb41fed2200e3087c0ff7
      release_identity_topology: true

  independent-signer-e2e:
    name: Release package IDs + different signers + explicit authorization
    needs: build-harness-host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REDACTGUARD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.redactguard_ref }}
      HARNEX_REF: 06321ada327666da259fb41fed2200e3087c0ff7
      HOST_PACKAGE: io.github.daniele21.localllm.phonetest
      HOST_TEST_PACKAGE: io.github.daniele21.localllm.phonetest.test
      CONSUMER_PACKAGE: io.github.daniele21.redactguard
      CONSUMER_TEST_PACKAGE: io.github.daniele21.redactguard.test
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Checkout RedactGuard exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REDACTGUARD_REF }}
          fetch-depth: 1
          path: redactguard

      - name: Download exact Harnex candidate
        uses: actions/download-artifact@v7
        with:
          name: shared-runtime-emulator-host
          path: ${{ runner.temp }}/harnex-candidate

      - name: Record exact source and package identities
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          candidate="$RUNNER_TEMP/harnex-candidate"
          mkdir -p "$evidence"
          git -C redactguard rev-parse HEAD | tee "$evidence/redactguard-source-revision.txt"
          cp "$candidate/source-revision.txt" "$evidence/harnex-source-revision.txt"
          cp "$candidate/consumer-sdk-source-revision.txt" "$evidence/harnex-consumer-sdk-source-revision.txt"
          cp "$candidate/consumer-sdk-version.txt" "$evidence/harnex-consumer-sdk-version.txt"
          cp "$candidate/host-package.txt" "$evidence/harnex-package.txt"
          cp "$candidate/host-test-package.txt" "$evidence/harnex-test-package.txt"
          cmp -s "$evidence/harnex-source-revision.txt" "$evidence/harnex-consumer-sdk-source-revision.txt"
          test "$(tr -d '\r\n' < "$evidence/harnex-source-revision.txt")" = "$HARNEX_REF"
          test "$(tr -d '\r\n' < "$evidence/harnex-package.txt")" = "$HOST_PACKAGE"
          test "$(tr -d '\r\n' < "$evidence/harnex-test-package.txt")" = "$HOST_TEST_PACKAGE"
          test -f "$candidate/harness-emulator-e2e.apk"
          test -f "$candidate/harness-debug-androidTest.apk"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android AVD home
        shell: bash
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd" "$RUNNER_TEMP/android-user"

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build RedactGuard against exact candidate SDK with release package identity
        working-directory: redactguard
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          candidate_repo="$RUNNER_TEMP/harnex-candidate/consumer-sdk-repository"
          candidate_version="$(tr -d '\r\n' < "$RUNNER_TEMP/harnex-candidate/consumer-sdk-version.txt")"
          ./gradlew --no-configuration-cache \
            -PreleaseIdentityE2e=true \
            -PharnessConsumerSdkRepository="$candidate_repo" \
            -PharnessConsumerSdkVersion="$candidate_version" \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Sign Harnex and RedactGuard with distinct ephemeral identities
        id: signed
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/harnex-candidate"
          unsigned_host="$candidate/harness-emulator-e2e.apk"
          unsigned_host_test="$candidate/harness-debug-androidTest.apk"
          unsigned_app="redactguard/app/build/outputs/apk/debug/app-debug.apk"
          unsigned_app_test="redactguard/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          for apk in "$unsigned_host" "$unsigned_host_test" "$unsigned_app" "$unsigned_app_test"; do
            test -f "$apk"
          done

          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          package_name() {
            "$aapt" dump badging "$1" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -n 1
          }
          test "$(package_name "$unsigned_host")" = "$HOST_PACKAGE"
          test "$(package_name "$unsigned_host_test")" = "$HOST_TEST_PACKAGE"
          test "$(package_name "$unsigned_app")" = "$CONSUMER_PACKAGE"
          test "$(package_name "$unsigned_app_test")" = "$CONSUMER_TEST_PACKAGE"
          {
            echo "host_package=$HOST_PACKAGE"
            echo "host_test_package=$HOST_TEST_PACKAGE"
            echo "consumer_package=$CONSUMER_PACKAGE"
            echo "consumer_test_package=$CONSUMER_TEST_PACKAGE"
            echo "release_package_topology=true"
          } | tee "$RUNNER_TEMP/independent-signer-e2e/package-identities.txt"

          signing_dir="$RUNNER_TEMP/independent-signer-keys"
          signed_dir="$RUNNER_TEMP/independent-signer-apks"
          mkdir -p "$signing_dir" "$signed_dir"
          host_keystore="$signing_dir/harnex.p12"
          consumer_keystore="$signing_dir/redactguard.p12"
          replacement_keystore="$signing_dir/redactguard-replacement.p12"
          host_pass="harnex-independent-e2e"
          consumer_pass="redactguard-independent-e2e"
          replacement_pass="redactguard-replacement-e2e"

          keytool -genkeypair \
            -keystore "$host_keystore" -storetype PKCS12 \
            -storepass "$host_pass" -keypass "$host_pass" \
            -alias harnex-e2e -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Harnex Independent Signer E2E,O=Local Test,C=IT" -noprompt
          keytool -genkeypair \
            -keystore "$consumer_keystore" -storetype PKCS12 \
            -storepass "$consumer_pass" -keypass "$consumer_pass" \
            -alias redactguard-e2e -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=RedactGuard Independent Signer E2E,O=Local Test,C=IT" -noprompt
          keytool -genkeypair \
            -keystore "$replacement_keystore" -storetype PKCS12 \
            -storepass "$replacement_pass" -keypass "$replacement_pass" \
            -alias redactguard-replacement-e2e -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=RedactGuard Replacement Signer E2E,O=Local Test,C=IT" -noprompt

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          sign_apk() {
            local source="$1"
            local target="$2"
            local keystore="$3"
            local alias="$4"
            local password="$5"
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$alias" \
              --ks-pass "pass:$password" \
              --key-pass "pass:$password" \
              --out "$target" \
              "$source"
            "$apksigner" verify "$target"
          }

          host_apk="$signed_dir/harnex-release-identity-e2e.apk"
          host_test_apk="$signed_dir/harnex-release-identity-androidTest.apk"
          app_apk="$signed_dir/redactguard-release-identity.apk"
          app_test_apk="$signed_dir/redactguard-release-identity-androidTest.apk"
          replacement_app_apk="$signed_dir/redactguard-release-identity-replacement.apk"
          replacement_app_test_apk="$signed_dir/redactguard-release-identity-replacement-androidTest.apk"
          sign_apk "$unsigned_host" "$host_apk" "$host_keystore" harnex-e2e "$host_pass"
          sign_apk "$unsigned_host_test" "$host_test_apk" "$host_keystore" harnex-e2e "$host_pass"
          sign_apk "$unsigned_app" "$app_apk" "$consumer_keystore" redactguard-e2e "$consumer_pass"
          sign_apk "$unsigned_app_test" "$app_test_apk" "$consumer_keystore" redactguard-e2e "$consumer_pass"
          sign_apk "$unsigned_app" "$replacement_app_apk" "$replacement_keystore" redactguard-replacement-e2e "$replacement_pass"
          sign_apk "$unsigned_app_test" "$replacement_app_test_apk" "$replacement_keystore" redactguard-replacement-e2e "$replacement_pass"

          rm -rf "$signing_dir"
          echo "host_apk=$host_apk" >> "$GITHUB_OUTPUT"
          echo "host_test_apk=$host_test_apk" >> "$GITHUB_OUTPUT"
          echo "app_apk=$app_apk" >> "$GITHUB_OUTPUT"
          echo "app_test_apk=$app_test_apk" >> "$GITHUB_OUTPUT"
          echo "replacement_app_apk=$replacement_app_apk" >> "$GITHUB_OUTPUT"
          echo "replacement_app_test_apk=$replacement_app_test_apk" >> "$GITHUB_OUTPUT"

      - name: Prove signer separation
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          digest() {
            "$apksigner" verify --print-certs "$1" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          }
          host_signer="$(digest '${{ steps.signed.outputs.host_apk }}')"
          host_test_signer="$(digest '${{ steps.signed.outputs.host_test_apk }}')"
          consumer_signer="$(digest '${{ steps.signed.outputs.app_apk }}')"
          consumer_test_signer="$(digest '${{ steps.signed.outputs.app_test_apk }}')"
          replacement_signer="$(digest '${{ steps.signed.outputs.replacement_app_apk }}')"
          replacement_test_signer="$(digest '${{ steps.signed.outputs.replacement_app_test_apk }}')"
          test -n "$host_signer"
          test -n "$consumer_signer"
          test -n "$replacement_signer"
          test "$host_signer" = "$host_test_signer"
          test "$consumer_signer" = "$consumer_test_signer"
          test "$replacement_signer" = "$replacement_test_signer"
          test "$host_signer" != "$consumer_signer"
          test "$host_signer" != "$replacement_signer"
          test "$consumer_signer" != "$replacement_signer"
          {
            echo "harnex_signer_sha256=$host_signer"
            echo "redactguard_signer_sha256=$consumer_signer"
            echo "redactguard_replacement_signer_sha256=$replacement_signer"
            echo "all_signers_are_distinct=true"
          } | tee "$evidence/signer-identities.txt"
          echo "consumer_signer=$consumer_signer" >> "$GITHUB_OUTPUT"
          echo "replacement_signer=$replacement_signer" >> "$GITHUB_OUTPUT"

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Create and start emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd \
            --force \
            --name harnex-independent-signer-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd harnex-independent-signer-api35 \
            -port 5554 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot \
            > "$RUNNER_TEMP/independent-signer-e2e/emulator.log" 2>&1 &
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
              adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
              adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/independent-signer-e2e/emulator.log" >&2 || true
          exit 1

      - name: Install Consumer before independently signed Host
        shell: bash
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.app_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.app_test_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.host_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.host_test_apk }}"

      - name: Prove explicit service survives Consumer-before-Host install order
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#bindCapabilityIsGrantedWhenConsumerWasInstalledBeforeHost \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/redactguard-bind-install-order.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-bind-install-order.txt"

      - name: Prove independent signer starts fail-closed
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#independentSignerIsDeniedUntilExplicitlyAuthorized \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/redactguard-pending-authorization.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-pending-authorization.txt"

      - name: Capture pending authorization Settings recovery
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          remote_video="/sdcard/redactguard-harnex-pending.mp4"
          local_video="$evidence/redactguard-harnex-pending.mp4"
          log="$evidence/redactguard-harnex-pending-ui.txt"
          adb -s "$ANDROID_SERIAL" shell rm -f "$remote_video"
          recorder_pid="$(adb -s "$ANDROID_SERIAL" shell "screenrecord --time-limit 30 $remote_video >/dev/null 2>&1 & echo \$!" | tr -d '\r')"
          test -n "$recorder_pid"
          sleep 1
          set +e
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.ui.HarnexConnectionSettingsE2eUiTest#pendingAuthorizationOpensHarnexFromSettings \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$log"
          test_status="${PIPESTATUS[0]}"
          set -e
          adb -s "$ANDROID_SERIAL" shell "kill -INT $recorder_pid" >/dev/null 2>&1 || true
          sleep 2
          adb -s "$ANDROID_SERIAL" pull "$remote_video" "$local_video" >/dev/null
          adb -s "$ANDROID_SERIAL" shell rm -f "$remote_video"
          test "$test_status" -eq 0
          grep -q "OK (1 test)" "$log"
          test -s "$local_video"

          focus_line="$(
            adb -s "$ANDROID_SERIAL" shell dumpsys window windows \
              | grep -E 'mCurrentFocus|mFocusedApp' \
              | grep -F "$HOST_PACKAGE" \
              | head -n 1 || true
          )"
          if [[ -z "$focus_line" ]]; then
            focus_line="$(
              adb -s "$ANDROID_SERIAL" shell dumpsys activity activities \
                | grep -E 'topResumedActivity|mResumedActivity|ResumedActivity' \
                | grep -F "$HOST_PACKAGE" \
                | head -n 1 || true
            )"
          fi
          test -n "$focus_line"
          printf '%s\n' "$focus_line" | tee "$evidence/harnex-open-recovery.txt"

      - name: Authorize exact observed identity from Harnex-owned instrumentation
        shell: bash
        env:
          CONSUMER_SIGNER: ${{ steps.identity.outputs.consumer_signer }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e consumerPackage "$CONSUMER_PACKAGE" \
            -e consumerSignerSha256 "$CONSUMER_SIGNER" \
            -e class io.github.daniele21.localllm.phonetest.HarnessIndependentConsumerAuthorizationInstrumentationTest#authorizeExactObservedConsumerIdentity \
            "$HOST_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/harnex-explicit-authorization.txt"
          grep -q "OK (1 test)" "$evidence/harnex-explicit-authorization.txt"

      - name: Capture authorized Settings disconnect and reconnect
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          remote_video="/sdcard/redactguard-harnex-reconnect.mp4"
          local_video="$evidence/redactguard-harnex-reconnect.mp4"
          log="$evidence/redactguard-harnex-reconnect-ui.txt"
          adb -s "$ANDROID_SERIAL" shell rm -f "$remote_video"
          recorder_pid="$(adb -s "$ANDROID_SERIAL" shell "screenrecord --time-limit 30 $remote_video >/dev/null 2>&1 & echo \$!" | tr -d '\r')"
          test -n "$recorder_pid"
          sleep 1
          set +e
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.ui.HarnexConnectionSettingsE2eUiTest#authorizedConnectionCanBeDisconnectedAndReconnectedFromSettings \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$log"
          test_status="${PIPESTATUS[0]}"
          set -e
          adb -s "$ANDROID_SERIAL" shell "kill -INT $recorder_pid" >/dev/null 2>&1 || true
          sleep 2
          adb -s "$ANDROID_SERIAL" pull "$remote_video" "$local_video" >/dev/null
          adb -s "$ANDROID_SERIAL" shell rm -f "$remote_video"
          test "$test_status" -eq 0
          grep -q "OK (1 test)" "$log"
          test -s "$local_video"

      - name: Prove authorized signer can disconnect and reconnect at owner boundary
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#authorizedIndependentSignerCanDisconnectAndReconnect \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/redactguard-authorized-reconnect.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-authorized-reconnect.txt"

      - name: Disable exact authorized identity from Harnex
        shell: bash
        env:
          CONSUMER_SIGNER: ${{ steps.identity.outputs.consumer_signer }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e consumerPackage "$CONSUMER_PACKAGE" \
            -e consumerSignerSha256 "$CONSUMER_SIGNER" \
            -e class io.github.daniele21.localllm.phonetest.HarnessIndependentConsumerAuthorizationInstrumentationTest#disableAuthorizedObservedConsumerIdentity \
            "$HOST_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/harnex-disable-authorization.txt"
          grep -q "OK (1 test)" "$evidence/harnex-disable-authorization.txt"

      - name: Prove Harnex-disabled identity is denied on fresh Consumer connection
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#disabledHostAuthorizationIsDeniedOnReconnect \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/redactguard-host-disabled-denied.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-host-disabled-denied.txt"

      - name: Reauthorize exact disabled identity from Harnex
        shell: bash
        env:
          CONSUMER_SIGNER: ${{ steps.identity.outputs.consumer_signer }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e consumerPackage "$CONSUMER_PACKAGE" \
            -e consumerSignerSha256 "$CONSUMER_SIGNER" \
            -e class io.github.daniele21.localllm.phonetest.HarnessIndependentConsumerAuthorizationInstrumentationTest#reauthorizeDisabledObservedConsumerIdentity \
            "$HOST_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/harnex-reauthorization.txt"
          grep -q "OK (1 test)" "$evidence/harnex-reauthorization.txt"

      - name: Prove explicit Harnex reauthorization restores Consumer connection
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#reauthorizedHostIdentityReconnects \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/redactguard-reauthorized-reconnect.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-reauthorized-reconnect.txt"

      - name: Prove authorized release-package topology reconnects after Host process restart
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am force-stop "$HOST_PACKAGE"
          adb -s "$ANDROID_SERIAL" shell monkey -p "$HOST_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 2
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#reauthorizedHostIdentityReconnects \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/redactguard-host-restart-reconnect.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-host-restart-reconnect.txt"

      - name: Replace RedactGuard with a new unapproved signer
        shell: bash
        run: |
          set -euo pipefail
          adb -s "$ANDROID_SERIAL" uninstall "$CONSUMER_TEST_PACKAGE" || true
          adb -s "$ANDROID_SERIAL" uninstall "$CONSUMER_PACKAGE" || true
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.replacement_app_apk }}"
          adb -s "$ANDROID_SERIAL" install "${{ steps.signed.outputs.replacement_app_test_apk }}"

      - name: Prove signer replacement cannot inherit authorization
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e class io.github.daniele21.redactguard.IndependentSignerAuthorizationE2eTest#independentSignerIsDeniedUntilExplicitlyAuthorized \
            "$CONSUMER_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/redactguard-replacement-denied.txt"
          grep -q "OK (1 test)" "$evidence/redactguard-replacement-denied.txt"

      - name: Prove Harnex records signer replacement as changed and blocked
        shell: bash
        env:
          REPLACEMENT_SIGNER: ${{ steps.identity.outputs.replacement_signer }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell am instrument -w \
            -e consumerPackage "$CONSUMER_PACKAGE" \
            -e consumerSignerSha256 "$REPLACEMENT_SIGNER" \
            -e class io.github.daniele21.localllm.phonetest.HarnessIndependentConsumerAuthorizationInstrumentationTest#observedSignerReplacementRemainsBlockedUntilReauthorization \
            "$HOST_TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner" \
            | tee "$evidence/harnex-signer-replacement-blocked.txt"
          grep -q "OK (1 test)" "$evidence/harnex-signer-replacement-blocked.txt"

      - name: Capture bounded package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/independent-signer-e2e"
          adb -s "$ANDROID_SERIAL" shell dumpsys package "$HOST_PACKAGE" \
            | tr -d '\r' \
            | sed -n '/HarnessSharedRuntimeService/,+10p' \
            > "$evidence/harnex-service-package.txt" || true
          adb -s "$ANDROID_SERIAL" shell dumpsys package "$CONSUMER_PACKAGE" \
            | tr -d '\r' \
            | grep -F \
                -e "Package [$CONSUMER_PACKAGE]" \
                -e "userId=" \
                -e "versionName=" \
            > "$evidence/redactguard-package.txt" || true
          sha256sum \
            "${{ steps.signed.outputs.host_apk }}" \
            "${{ steps.signed.outputs.host_test_apk }}" \
            "${{ steps.signed.outputs.app_apk }}" \
            "${{ steps.signed.outputs.app_test_apk }}" \
            "${{ steps.signed.outputs.replacement_app_apk }}" \
            "${{ steps.signed.outputs.replacement_app_test_apk }}" \
            > "$evidence/apk-sha256.txt"

      - name: Upload privacy-safe release-identity E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harnex-release-identity-independent-signer-e2e
          path: ${{ runner.temp }}/independent-signer-e2e/**
          if-no-files-found: error
          retention-days: 14
