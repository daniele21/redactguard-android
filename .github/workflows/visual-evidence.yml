name: Visual evidence

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REDACTGUARD_BUILD_ID: gha-visual-${{ github.run_id }}
      REDACTGUARD_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      REDACTGUARD_SOURCE_DIRTY: 'false'
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate visual evidence tests compile
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Render compact and expanded reference surfaces
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/capture-visual-evidence-emulator.sh

      - name: Write evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p visual-evidence
          cat > visual-evidence/manifest.txt <<EOF
          evidence_kind=android_emulator_visual_reference
          source_revision=${{ github.event.pull_request.head.sha || github.sha }}
          workflow_run=${{ github.run_id }}
          api_level=35
          compact_logical_display=1080x2400@420dpi
          expanded_logical_display=1600x2560@320dpi
          claim_boundary=Emulator evidence supports visual/adaptive review only; physical-device accessibility, runtime integration, performance and usability remain separate gates.
          EOF
          find visual-evidence -maxdepth 3 -type f -print | sort

      - name: Upload bounded visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redactguard-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence
          if-no-files-found: error
          retention-days: 7
