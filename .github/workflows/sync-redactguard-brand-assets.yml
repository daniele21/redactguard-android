name: Sync canonical RedactGuard brand assets

on:
  push:
    branches:
      - agent/rg-mobile-experience
    paths:
      - '.github/workflows/sync-redactguard-brand-assets.yml'

permissions:
  contents: write

jobs:
  sync-brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/rg-mobile-experience

      - name: Copy and verify canonical desktop assets
        shell: bash
        run: |
          set -euo pipefail
          destination='app/src/main/res/drawable-nodpi'
          mkdir -p "$destination"

          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/daniele21/redact-guard/main/public/logo.png' \
            --output "$destination/redactguard_logo.png"
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/daniele21/redact-guard/main/public/logo-dark.png' \
            --output "$destination/redactguard_logo_dark.png"
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/daniele21/redact-guard/main/public/favicon.png' \
            --output "$destination/redactguard_mark.png"

          [[ "$(git hash-object "$destination/redactguard_logo.png")" == '25d56f3972f1049a45bd7735981735dfb671b759' ]]
          [[ "$(git hash-object "$destination/redactguard_logo_dark.png")" == '468a880ebf6a66e7ae7f9a54ec4637ff1cbd40dc' ]]
          [[ "$(git hash-object "$destination/redactguard_mark.png")" == '49318653597486b1aaf4230c8c75b8b997453f6c' ]]

      - name: Commit repository-owned assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi
          git rm .github/workflows/sync-redactguard-brand-assets.yml
          git commit -m 'chore(brand): vendor verified RedactGuard assets'
          git push origin HEAD:agent/rg-mobile-experience
