name: VUI18 Tighten Protection Spacing

on:
  push:
    branches:
      - agent/rg-vui18-exact-head-integration
    paths:
      - .github/workflows/vui18-tighten-protection-spacing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: agent/rg-vui18-exact-head-integration
          fetch-depth: 0

      - name: Tighten only the Protection scroll spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/io/github/daniele21/redactguard/ui/ProtectionSelectionScreen.kt')
          text = path.read_text(encoding='utf-8')
          lazy = text.find('LazyColumn(')
          if lazy < 0:
              raise SystemExit('Protection LazyColumn owner not found')
          needle = 'verticalArrangement = Arrangement.spacedBy(RedactGuardSpacing.sm),'
          spacing = text.find(needle, lazy)
          if spacing < 0:
              raise SystemExit('Protection LazyColumn sm spacing not found')
          next_lazy = text.find('LazyColumn(', lazy + 1)
          if next_lazy >= 0 and spacing > next_lazy:
              raise SystemExit('sm spacing resolved outside the first Protection LazyColumn')
          replacement = 'verticalArrangement = Arrangement.spacedBy(RedactGuardSpacing.xs),'
          updated = text[:spacing] + replacement + text[spacing + len(needle):]
          if updated.count(replacement) != text.count(replacement) + 1:
              raise SystemExit('expected exactly one new xs spacing occurrence')
          path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          changed_lines="$(git diff --numstat -- app/src/main/kotlin/io/github/daniele21/redactguard/ui/ProtectionSelectionScreen.kt | awk '{print $1 ":" $2}')"
          [[ "$changed_lines" == '1:1' ]] || {
            echo "Expected a 1-line Protection spacing delta, got ${changed_lines:-none}" >&2
            git diff -- app/src/main/kotlin/io/github/daniele21/redactguard/ui/ProtectionSelectionScreen.kt
            exit 1
          }
          git diff -- app/src/main/kotlin/io/github/daniele21/redactguard/ui/ProtectionSelectionScreen.kt

      - name: Commit focused layout fix and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/io/github/daniele21/redactguard/ui/ProtectionSelectionScreen.kt
          git rm .github/workflows/vui18-tighten-protection-spacing.yml
          git diff --cached --check
          git commit -m 'fix(ui): keep Protection disclosure clear of CTA'
          git push origin HEAD:agent/rg-vui18-exact-head-integration
