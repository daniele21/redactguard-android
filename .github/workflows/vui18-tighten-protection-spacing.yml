name: VUI18 Tighten Protection Spacing

on:
  push:
    branches:
      - agent/rg-vui18-exact-head-integration
    paths:
      - .github/workflows/vui18-tighten-protection-spacing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: agent/rg-vui18-exact-head-integration
          fetch-depth: 0

      - name: Tighten only the Protection scroll spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/io/github/daniele21/redactguard/ui/ProtectionSelectionScreen.kt')
          text = path.read_text(encoding='utf-8')
          needle = '''        LazyColumn(
              verticalArrangement = Arrangement.spacedBy(RedactGuardSpacing.sm),
              modifier = Modifier.weight(1f),
          ) {'''
          replacement = '''        LazyColumn(
              verticalArrangement = Arrangement.spacedBy(RedactGuardSpacing.xs),
              modifier = Modifier.weight(1f),
          ) {'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one Protection LazyColumn spacing owner, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
          git diff --check
          git diff -- app/src/main/kotlin/io/github/daniele21/redactguard/ui/ProtectionSelectionScreen.kt

      - name: Commit focused layout fix and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/io/github/daniele21/redactguard/ui/ProtectionSelectionScreen.kt
          git rm .github/workflows/vui18-tighten-protection-spacing.yml
          git diff --cached --check
          git commit -m 'fix(ui): keep Protection disclosure clear of CTA'
          git push origin HEAD:agent/rg-vui18-exact-head-integration
